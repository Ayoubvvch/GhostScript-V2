name: Build GhostScript V2 Native Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build GhostScript V2 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/GhostScript-v2.2.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostScript-v2.2.0-APK
          path: release-output/GhostScript-v2.2.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.2.0
          name: "GhostScript Root V2.2.0 - Dual-Engine Distraction Scanner Edition"
          body: |
            ### 👻 GhostScript Root V2.2.0: Dual-Engine Distraction Scanner Edition

            - **Dual-Engine Package Visibility & Discovery:**
              - Added `QUERY_ALL_PACKAGES` permission in manifest.
              - Implemented dual-engine package scanning (`PackageManager` + Root `pm list packages`).
              - Instant recognition of TikTok (`com.zhiliaoapp.musically` and TikTok Lite `com.zhiliaoapp.musically.go`), Instagram, WhatsApp, Facebook, Messenger, YouTube, etc.
              - Dynamic detection of present distraction apps with fallback friendly names and colorful badges.
              - Preserves ChatGPT, Gemini, and study tools with full internet access.
            - **Guaranteed Floating WindowManager Overlay & Toast:**
              - High-priority floating AMOLED toast with glowing borders.
          files: release-output/GhostScript-v2.2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
