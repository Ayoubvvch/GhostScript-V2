name: Build GhostScript V2 Native Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build GhostScript V2 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/GhostScript-v2.1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostScript-v2.1.0-APK
          path: release-output/GhostScript-v2.1.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.1.0
          name: "GhostScript Root V2.1.0 - WindowManager Overlay & Trampoline Toast Edition"
          body: |
            ### 👻 GhostScript Root V2.1.0: WindowManager Overlay & Trampoline Toast Edition

            - **Guaranteed Floating Overlay & Toast Bypass:**
              - Fixes Android 11+ background toast suppression completely.
              - Implements `ToastOverlayService` using `WindowManager` `TYPE_APPLICATION_OVERLAY` (identical to Termux-Toast architecture).
              - Implements 0-ms transparent `ToastActivity` trampoline for native system toasts.
              - Auto-grants `SYSTEM_ALERT_WINDOW` permission via root (`appops set com.ayoub.ghostscript2 SYSTEM_ALERT_WINDOW allow`).
              - Enhanced `/data/local/tmp/toast "<message>"` CLI script triggering both overlay and toast.
            - **Social Distraction Blocker (pm suspend):**
              - Freezes social distractions during study sessions, preserving ChatGPT, Gemini, and browsers with full internet.
            - **Wisdom & Quotes Messenger:**
              - Displays quotes from Einstein, Marcus Aurelius, Ibn Khaldun, and custom phrases.
          files: release-output/GhostScript-v2.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
